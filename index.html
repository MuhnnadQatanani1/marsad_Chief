<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — هيئة مكافحة الفساد الفلسطينية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-bg-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
        <div class="login-card">
            <div class="login-header">
                <div class="shield-icon">
                    <i class="bi bi-shield-check"></i>
                </div>
                <h1>هيئة مكافحة الفساد الفلسطينية</h1>
                <p>مرصد مؤشرات مكافحة الفساد</p>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username"><i class="bi bi-person"></i> اسم المستخدم</label>
                    <input type="text" id="username" placeholder="أدخل اسم المستخدم" autocomplete="off">
                    <span class="error-msg" id="userError"></span>
                </div>
                <div class="form-group">
                    <label for="password"><i class="bi bi-lock"></i> كلمة المرور</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="أدخل كلمة المرور">
                        <button type="button" class="toggle-pass" onclick="togglePassword()">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                    <span class="error-msg" id="passError"></span>
                </div>
                <button type="submit" class="login-btn">
                    <span>تسجيل الدخول</span>
                    <i class="bi bi-box-arrow-in-left"></i>
                </button>
                <div class="login-footer">
                    <p><i class="bi bi-info-circle"></i> نسخة تجريبية — بيانات وهمية للعرض فقط</p>
                </div>
            </form>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
