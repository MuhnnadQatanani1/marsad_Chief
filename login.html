<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — مقياس إنفاذ القانون</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/site.css">
    <link rel="stylesheet" href="css/extra.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-shapes" aria-hidden="true">
            <span class="auth-shape auth-shape-1"></span>
            <span class="auth-shape auth-shape-2"></span>
            <span class="auth-shape auth-shape-3"></span>
        </div>

        <div class="auth-card" id="authCard">
            <div class="auth-header">
                <div class="auth-shield auth-logo"><img src="assets/pacc-logo.jpg" alt="شعار هيئة مكافحة الفساد" onerror="this.remove()"></div>
                <h1>هيئة مكافحة الفساد</h1>
                <p>لوحة متابعة مؤشرات «مقياس إنفاذ القانون» 2022–2025</p>
            </div>

            <form class="auth-form" id="loginForm" novalidate>
                <div class="form-group">
                    <label for="username"><i class="bi bi-person"></i> اسم المستخدم</label>
                    <input class="auth-input" type="text" id="username" name="username" autocomplete="username"
                           placeholder="اسم المستخدم" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password"><i class="bi bi-lock"></i> كلمة المرور</label>
                    <div class="auth-password-wrap">
                        <input class="auth-input" type="password" id="password" name="password"
                               autocomplete="current-password" placeholder="كلمة المرور" required>
                        <button type="button" class="auth-toggle-pass" id="togglePass" tabindex="-1" aria-label="إظهار كلمة المرور">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <span class="auth-error" id="loginError" role="alert"></span>
                <button type="submit" class="auth-btn" id="loginBtn">
                    <i class="bi bi-box-arrow-in-left"></i>
                    <span id="loginBtnText">دخول</span>
                </button>
            </form>

            <div class="auth-footer">
                <p><i class="bi bi-info-circle"></i> هذا النظام مخصص للمستخدمين المصرح لهم فقط.</p>
            </div>
        </div>
    </div>

    <script src="js/users.js"></script>
    <script src="js/auth.js"></script>
    <script>
        'use strict';
        (function () {
            var errorEl = document.getElementById('loginError');
            var form = document.getElementById('loginForm');
            var btn = document.getElementById('loginBtn');
            var btnText = document.getElementById('loginBtnText');
            var card = document.getElementById('authCard');

            var toggleBtn = document.getElementById('togglePass');
            var passEl = document.getElementById('password');
            var passVisible = false;

            toggleBtn.addEventListener('click', function () {
                passVisible = !passVisible;
                passEl.type = passVisible ? 'text' : 'password';
                toggleBtn.innerHTML = passVisible ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
            });

            // جلسة قائمة؟ أَخرِج أي جلسة سابقة للدخول من جديد
            if (getSession()) clearSession();

            function setError(txt, isError) {
                errorEl.innerHTML = isError
                    ? '<i class="bi bi-exclamation-circle-fill"></i> ' + txt
                    : txt;
                if (isError) {
                    card.classList.remove('auth-shake');
                    void card.offsetWidth; // إعادة تشغيل الإنيميشن
                    card.classList.add('auth-shake');
                }
            }

            function updateLockUI(seconds) {
                btn.disabled = true;
                btnText.textContent = 'محاولة لاحقاً (' + seconds + ')';
            }

            function enableBtn() {
                btn.disabled = false;
                btnText.textContent = 'دخول';
            }

            // تطبيق حالة القفل إن وُجدت (تأخير بعد المحاولات الفاشلة)
            var lockLeft = remainingLockSeconds();
            if (lockLeft > 0) {
                updateLockUI(lockLeft);
                passEl.disabled = true;
                var lockTimer = setInterval(function () {
                    var left = remainingLockSeconds();
                    if (left <= 0) {
                        clearInterval(lockTimer);
                        enableBtn();
                        passEl.disabled = false;
                        setError('', false);
                    } else {
                        btnText.textContent = 'محاولة لاحقاً (' + left + ')';
                    }
                }, 1000);
            }

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                if (btn.disabled) return;
                setError('', false);

                var username = document.getElementById('username').value;
                var password = document.getElementById('password').value;
                if (!username.trim() || !password) {
                    setError('بيانات الدخول غير صحيحة', true);
                    return;
                }

                btn.disabled = true;
                btnText.textContent = 'جارٍ التحقق…';

                try {
                    var res = await authenticate(username, password);
                    btn.disabled = false;
                    btnText.textContent = 'دخول';

                    if (res.ok) {
                        resetFailures();
                        var target = res.session.role === 'chairman' ? 'chairman.html' : 'deputy.html';
                        window.location.replace(target);
                    } else {
                        var f = registerFailure();
                        setError('بيانات الدخول غير صحيحة', true);
                        if (f.locked) {
                            updateLockUI(f.seconds);
                            passEl.disabled = true;
                            setTimeout(function () {
                                enableBtn();
                                passEl.disabled = false;
                            }, f.seconds * 1000);
                        }
                    }
                } catch (err) {
                    btn.disabled = false;
                    btnText.textContent = 'دخول';
                    setError('بيانات الدخول غير صحيحة', true);
                }
            });
        })();
    </script>
</body>
</html>
